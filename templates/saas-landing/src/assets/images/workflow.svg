<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Workflow illustration placeholder">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#3b6ef6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" rx="24" fill="url(#wbg)"/>
  <!-- floating cards suggesting a board -->
  <g opacity="0.96">
    <rect x="120" y="150" width="560" height="150" rx="18" fill="#ffffff"/>
    <rect x="152" y="182" width="60" height="60" rx="14" fill="#dbeafe"/>
    <rect x="230" y="188" width="240" height="16" rx="8" fill="#1e293b"/>
    <rect x="230" y="220" width="360" height="12" rx="6" fill="#94a3b8"/>
    <rect x="230" y="248" width="300" height="12" rx="6" fill="#cbd5e1"/>
  </g>
  <g opacity="0.92">
    <rect x="160" y="430" width="560" height="150" rx="18" fill="#ffffff"/>
    <rect x="192" y="462" width="60" height="60" rx="14" fill="#dcfce7"/>
    <rect x="270" y="468" width="200" height="16" rx="8" fill="#1e293b"/>
    <rect x="270" y="500" width="360" height="12" rx="6" fill="#94a3b8"/>
    <rect x="270" y="528" width="280" height="12" rx="6" fill="#cbd5e1"/>
  </g>
  <g opacity="0.88">
    <rect x="120" y="710" width="560" height="150" rx="18" fill="#ffffff"/>
    <rect x="152" y="742" width="60" height="60" rx="14" fill="#fef9c3"/>
    <rect x="230" y="748" width="280" height="16" rx="8" fill="#1e293b"/>
    <rect x="230" y="780" width="360" height="12" rx="6" fill="#94a3b8"/>
    <rect x="230" y="808" width="320" height="12" rx="6" fill="#cbd5e1"/>
  </g>
  <!-- connectors -->
  <path d="M400 300 L400 430" stroke="#93c5fd" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M400 580 L400 710" stroke="#93c5fd" stroke-width="4" stroke-dasharray="8 8"/>
</svg>
