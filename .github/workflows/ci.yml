name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11.12 needs Node >=22.13 (uses node:sqlite). Node 20 crashes at
        # setup with ERR_UNKNOWN_BUILTIN_MODULE. Consumers can still run the
        # published packages on Node >=20; this is only our dev/CI toolchain.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup reads it from the root
      # package.json "packageManager" field (pnpm@11.12.0). Specifying both
      # errors with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests (@parche/astro, @parche/elements contract)
        run: pnpm run test:unit

      - name: SSR render tests (@parche/elements)
        run: pnpm run test:ssr

      # Templates pin concrete versions — they cannot use catalog: — so this is
      # what keeps the catalog in charge of them rather than letting them drift.
      - name: Template dependencies in step with the catalog
        run: pnpm run templates:check

      - name: Build all (packages, examples, templates)
        run: pnpm -r build

      - name: Assert dist invariants (build-smoke)
        run: node test/assert-dist.mjs

      # The accessibility gate: every element page of the built playground,
      # axe WCAG 2.1 AA in Chromium, Firefox and WebKit, light and dark, plus
      # the no-JS and reduced-motion passes and the per-element keyboard specs.
      - name: Install Playwright browsers
        run: pnpm --filter @parche/elements exec playwright install --with-deps

      - name: Browser a11y gate (@parche/elements)
        run: pnpm run test:browser

      # Every element rendered per request on Node and on workerd.
      - name: SSR smoke (Node + Cloudflare)
        run: pnpm run test:ssr-smoke

      - name: Starter scaffold + build (hello-parche)
        run: pnpm run test:starter
