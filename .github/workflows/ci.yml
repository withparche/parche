name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11.12 needs Node >=22.13 (uses node:sqlite). Node 20 crashes at
        # setup with ERR_UNKNOWN_BUILTIN_MODULE. Consumers can still run the
        # published packages on Node >=20; this is only our dev/CI toolchain.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup reads it from the root
      # package.json "packageManager" field (pnpm@11.12.0). Specifying both
      # errors with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build framework + CLI
        run: |
          pnpm --filter @parche/cli build
          pnpm --filter create-parche build

      - name: Build examples
        run: |
          for ex in blog i18n themes custom-widget markdown-pages ssr import-widget react shadcn; do
            echo "── building example-$ex"
            pnpm --filter "example-$ex" build
          done

      - name: CLI smoke test (scaffold from the local template)
        run: |
          node packages/cli/dist/index.js astro new ./templates/hello-parche /tmp/smoke --no-install --no-git --yes
          if grep -rl '{{' /tmp/smoke; then echo "::error::placeholders left unreplaced"; exit 1; fi
          test -f /tmp/smoke/package.json && ! test -f /tmp/smoke/parche.template.json
