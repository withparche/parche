# Link a workspace package whenever its version satisfies the declared range.
# This is what lets a template declare a published range — so it installs
# anywhere, which is what `npm create astro -- --template …` needs — while CI
# still builds it against the code in the PR. Off by default since pnpm 8.
linkWorkspacePackages: true

packages:
  - "packages/*"
  - "parches/*"
  - "examples/*"
  # Full-site demos: bigger than an example, not a CLI-served starter.
  - "demos/*"
  # Templates declare published ranges so they install anywhere — that is what
  # makes `npm create astro -- --template <repo>/templates/<name>` work. Inside
  # the repo, pnpm.overrides in the root package.json redirects those ranges to
  # the local packages, so CI builds every template against the code in the PR.
  - "templates/*"

# Central version catalog. Packages reference these with "catalog:".
catalog:
  astro: ^7.2.4
  "@astrojs/node": ^11.1.4
  "@astrojs/react": ^6.0.4
  "@astrojs/rss": ^4.0.19
  astro-icon: ^1.2.0
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  tailwind-merge: ^3.6.0
  zod: ^4.4.3
  sharp: ^0.35.3
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  "@iconify-json/tabler": ^1.2.38
  "@iconify-json/lucide": ^1.2.98
  "@iconify-json/simple-icons": ^1.2.75

# pnpm's new-package cooldown was gating the latest satteri (Astro 7's markdown
# engine) and falling back to an older release whose Apple-Silicon binary was
# never published. Disable the cooldown so the latest published versions install.
minimumReleaseAge: 0

allowBuilds:
  es5-ext: true
  esbuild: true
  sharp: true
