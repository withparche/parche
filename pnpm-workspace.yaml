packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"

# Central version catalog. Packages reference these with "catalog:".
catalog:
  astro: ^7.2.4
  "@astrojs/node": ^11.1.4
  "@astrojs/react": ^6.0.4
  "@astrojs/rss": ^4.0.19
  astro-icon: ^1.2.0
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  tailwind-merge: ^3.6.0
  zod: ^4.4.3
  sharp: ^0.35.3
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  "@iconify-json/tabler": ^1.2.38
  "@iconify-json/lucide": ^1.2.98
  "@iconify-json/simple-icons": ^1.2.75

# Adopt latest releases immediately (Astro 7's native markdown bindings are
# recent). Disables pnpm's new-package cooldown for this repo.
minimumReleaseAge: 0

# satteri 0.10.4 (pulled in by Astro 7) shipped without an Apple-Silicon binary;
# 0.10.5 restores it. Override until Astro bumps its markdown engine.
overrides:
  satteri: 0.10.5

allowBuilds:
  es5-ext: true
  esbuild: true
  sharp: true
